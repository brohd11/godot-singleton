export_root: "res://addons/_lib/singleton/_export_ignore/exports"
plugin_folder: "Singleton{{version=singleton}}"
pre_script: "res://addons/_lib/singleton/_export_ignore/pre_post_export.gd"
post_script: "res://addons/_lib/singleton/_export_ignore/pre_post_export.gd"
build_require: []
compile_require: []
options:
  overwrite: true
  include_uid: true
  include_import: true
  ignore_src: true
  use_tag_in_cfg: true
  exported_deps: []
  include_min_version: true
  move_global_files: true
  include_docs: true
  include_project_license: false
  parser_settings:
    use_relative_paths: false
    backport_target: 100
    parse_cs:
      namespace_rename: {}
    parse_gd:
      replace_editor_interface: false
      class_rename_ignore: []
      backport_string_renames: {}
    parse_tscn: {}
    parse_tres: {}
exports:
  -
    source: "res://addons/_lib/singleton"
    export_name: "singleton{{version=singleton}}"
    export_folder: "addons/_lib/singleton"
    exclude:
      directories:
        - "res://addons/_lib/singleton/_export_ignore"
      file_extensions: []
      files: []
    other_transfers: []
    parser_overide_settings:
      parse_cs: {}
      parse_gd: {}
      parse_tscn: {}
      parse_tres: {}
    remote_dir: "res://addons/_lib/singleton/src/remote"
